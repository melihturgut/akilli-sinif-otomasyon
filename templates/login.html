<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giriş — Hoca Paneli</title>
  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" content="#0a2340" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="/static/icons/favicon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Akıllı Sınıf" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <style>
    .login-wrap {
      min-height: calc(100vh - 90px);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .login-card {
      width: 100%; max-width: 360px;
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
      padding: 24px 22px;
    }
    .login-icon { font-size: 2.6rem; text-align: center; margin-bottom: 6px; }
    .login-title { text-align: center; font-weight: 700; font-size: 1.05rem; margin: 0 0 16px; }
    label { font-size: .7rem; color: var(--muted); display: block; margin: 10px 0 4px;
            text-transform: uppercase; letter-spacing: .4px; }
    input {
      width: 100%; background: #0a0f1a; border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: .95rem; padding: 11px 12px;
    }
    input:focus { outline: none; border-color: var(--primary); }
    .err-msg {
      background: rgba(248,113,113,.1); border: 1px solid var(--danger);
      color: var(--danger); padding: 9px 12px; border-radius: 8px; font-size: .78rem;
      margin-top: 14px; display: none;
    }
    .err-msg.show { display: block; }
    .hint-box {
      background: rgba(56,189,248,.08); border: 1px solid rgba(56,189,248,.3);
      border-radius: 8px; padding: 8px 12px; font-size: .68rem; color: var(--text);
      margin-top: 14px;
    }
  </style>
</head>
<body>

<div class="app-header">
  <h1>🔐 Hoca Paneli Girişi</h1>
  <p>Yetkili kullanıcı girişi gerekli</p>
</div>

<div class="login-wrap">
  <form class="login-card" onsubmit="doLogin(event)">
    <div class="login-icon">👨‍🏫</div>
    <h2 class="login-title">Giriş Yap</h2>

    <label>Kullanıcı Adı</label>
    <input type="text" id="username" autocomplete="username" required autofocus />

    <label>Şifre</label>
    <input type="password" id="password" autocomplete="current-password" required />

    <button type="submit" class="btn-app btn-primary-app" style="margin-top:16px" id="btn-login">
      Giriş Yap
    </button>

    <div id="err" class="err-msg"></div>

    <div class="hint-box">
      <b>İlk kurulum:</b> Varsayılan kullanıcı <code>admin</code> · şifre <code>admin123</code>.
      Girdikten sonra panelden değiştirin.
    </div>
  </form>
</div>

<script>
  const NEXT = {{ next|tojson }};

  function doLogin(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const err = document.getElementById('err');
    const btn = document.getElementById('btn-login');
    err.className = 'err-msg';
    btn.disabled = true;
    btn.textContent = 'Kontrol ediliyor...';

    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    })
    .then(r => r.json())
    .then(res => {
      btn.disabled = false;
      btn.textContent = 'Giriş Yap';
      if (res.ok) {
        window.location.href = NEXT || '/hoca';
      } else {
        err.textContent = res.error || 'Giriş başarısız.';
        err.className = 'err-msg show';
      }
    })
    .catch(() => {
      btn.disabled = false;
      btn.textContent = 'Giriş Yap';
      err.textContent = 'Bağlantı hatası.';
      err.className = 'err-msg show';
    });
  }
</script>
<script src="/static/pwa.js"></script>

</body>
</html>
