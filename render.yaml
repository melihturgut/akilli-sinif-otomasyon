# Render.com deployment konfigürasyonu
# Otomatik olarak deploy edilir, manuel adım gerekmez.
services:
  - type: web
    name: akilli-sinif
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: TZ
        value: Europe/Istanbul
    autoDeploy: true
